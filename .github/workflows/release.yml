# Publishes a release when a version tag is pushed (`git tag v1.2.0 && git
# push origin v1.2.0`): builds Lowtide with its helpers, signs it with the
# Developer ID, has Apple notarize it, and attaches the DMG, the zip Lowtide's
# updater installs, and their checksums to a GitHub release. Every copy of
# Lowtide finds it within a day (Settings › General › Updates).
#
# Needs these repository secrets, in a `release` environment (docs/RELEASING.md):
#   DEVELOPER_ID_P12           base64 of the Developer ID Application certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  its export password
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's id
#   NOTARY_ISSUER_ID           the issuer id shown above the keys
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and publish
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    env:
      # Lowtide needs the macOS 27 SDK: Xcode 27.2, beside the image's default.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      LOWTIDE_SCRATCH: ${{ github.workspace }}/.build/app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Version from the tag
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tags look like v1.2.0, not $TAG"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Support/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" Support/Info.plist

      - name: Tests
        run: TAIL=200 zsh scripts/test.sh

      - name: Signing keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Searched first, before the runner's own login keychain.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/developer-id.p12"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [[ -n "$IDENTITY" ]] || { echo "The certificate isn't a Developer ID Application certificate."; exit 1; }
          echo "LOWTIDE_SIGN=$IDENTITY" >> "$GITHUB_ENV"

      - name: Metal toolchain (for the dictation helper's MLX shaders)
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Helpers
        run: |
          zsh scripts/build-privileged.sh
          zsh scripts/build-voice.sh

      - name: Build, sign, notarize
        env:
          LOWTIDE_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          LOWTIDE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          LOWTIDE_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: zsh scripts/release.sh

      - name: Release notes
        run: |
          # The CHANGELOG's section for this version, else GitHub's own list.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "NOTES_SIZE=$(wc -c < "$RUNNER_TEMP/notes.md" | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=(--generate-notes)
          [[ "$NOTES_SIZE" -gt 1 ]] && NOTES=(--notes-file "$RUNNER_TEMP/notes.md")
          gh release create "$TAG" --title "Lowtide $VERSION" --verify-tag "${NOTES[@]}" \
            "dist/Lowtide-$VERSION.dmg" "dist/Lowtide-$VERSION.zip" dist/SHA256SUMS

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
