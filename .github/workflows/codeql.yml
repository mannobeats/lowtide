# GitHub's code scanning for Swift and the workflows themselves: weekly, on
# pull requests to main, and on demand. Free for public repositories.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [swift, actions]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}

      - name: Build
        if: matrix.language == 'swift'
        run: xcrun swift build --scratch-path .build/codeql

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
