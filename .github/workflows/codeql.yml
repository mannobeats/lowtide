# GitHub's code scanning for the workflows: weekly, on pull requests to main,
# and on demand. Free for public repositories.
#
# Swift isn't scanned yet: CodeQL's Swift tracer is an Intel binary that
# needs Rosetta, which GitHub's macOS 27 image doesn't allow, and Lowtide
# needs the macOS 27 SDK. Add `swift` back once CodeQL runs natively there.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v3
        with:
          languages: actions
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:actions
