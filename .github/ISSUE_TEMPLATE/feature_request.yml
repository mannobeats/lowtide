name: Idea
description: Something Lowtide could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or problem, in your words. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work in Lowtide, and where (which space or page).
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Other apps that do it well, sketches, screenshots.
